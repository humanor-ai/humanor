<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>humanor — one line a day</title>
<meta name="description" content="One line a day. A human wrote it, or a machine did. Vote. Every answer is sealed before you play.">
<meta name="theme-color" content="#050505">
<meta property="og:title" content="humanor">
<meta property="og:description" content="One line a day. Human or AI? Every answer is sealed before you vote.">
<meta property="og:type" content="website">
<link rel="icon" href="/favicon.png">
<!-- Before launch: self-host these two faces and delete this line. See style.css. -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<main>
  <p class="eyebrow rise rise-1" id="eyebrow">N°—</p>

  <p class="line rise rise-2" id="line">&nbsp;</p>

  <div class="vote rise rise-3" id="vote" role="group" aria-label="Who wrote this line?">
    <button class="choice choice--human" data-vote="HUMAN" aria-pressed="false">HUMAN</button>
    <span class="divider" aria-hidden="true"></span>
    <button class="choice choice--ai" data-vote="AI" aria-pressed="false">AI</button>
  </div>

  <p class="receipt" id="receipt" hidden></p>

  <a class="seal rise rise-4" id="seal" href="/proof.html" title="How the seal works"></a>
</main>

<footer>
  <a href="/proof.html">sealed</a>
  <a href="/archive.html">archive</a>
  <a href="https://github.com/humanor-ai/humanor" rel="noopener">open</a>
</footer>

<script>
/* ------------------------------------------------------------------ store */
/* A random id, generated once, kept on the device. It identifies a browser,
   never a person: no account, no cookie, no tracking. It exists only so the
   same browser cannot vote twice on the same round. */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

const API = 'https://humanor-api.humanor-ai.workers.dev';
const REVEAL_ZONE = 'Europe/Paris', REVEAL_HOUR = 17, REVEAL_MIN = 55;

function voterId() {
  let v = store.get('voter', null);
  if (!v) {
    v = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
    store.set('voter', v);
  }
  return v;
}

/* ------------------------------------------------------------------- data */

async function boot() {
  let rounds = [];
  try {
    rounds = await (await fetch(API + '/api/rounds', { cache: 'no-store' })).json();
  } catch {
    // the API is the source of truth; the file is only a fallback so the page
    // is never blank
    try { rounds = await (await fetch('/rounds.json', { cache: 'no-store' })).json(); } catch {}
  }

  const live = (rounds || []).filter(r => r.published).sort((a, b) => b.no - a.no);
  const round = live[0];
  if (!round) { document.getElementById('line').textContent = 'The first line arrives soon.'; return; }

  document.getElementById('eyebrow').textContent = 'N°' + String(round.no).padStart(3, '0');
  document.getElementById('line').textContent = round.text;

  const short = s => s.slice(0, 16) + '…' + s.slice(-8);
  const seal = document.getElementById('seal');
  seal.innerHTML = round.revealed
    ? '<small>salt published · verify</small>' + short(round.salt)
    : '<small>sealed before you vote</small>' + short(round.sha256);

  wireVote(round);
}

/* ------------------------------------------------------------------- vote */

function wireVote(round) {
  const box = document.getElementById('vote');
  const receipt = document.getElementById('receipt');
  const votes = store.get('votes', {});

  const paint = (choice, data, sent) => {
    box.classList.add('done');
    [...box.querySelectorAll('.choice')].forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.vote === choice));
      b.disabled = true;
    });

    const r = data || round;
    let html;

    if (r.revealed) {
      const right = choice === r.label;
      html = (right ? 'Right. ' : 'Wrong. ') + 'It was <b>' + r.label + '</b>' +
             (r.source ? '<br>' + r.source : '') +
             (r.foolRate != null ? '<br>' + r.foolRate + '% of players were fooled.' : '');
    } else if (sent) {
      const v = r.votes || { human: 0, ai: 0 };
      const total = v.human + v.ai;
      html = 'Counted. The answer was sealed before you voted.';
      if (total >= 10) {
        const pct = Math.round((choice === 'HUMAN' ? v.human : v.ai) / total * 100);
        html += '<br>You are with <b>' + pct + '%</b> of ' + total.toLocaleString() + ' players.';
      }
      html += '<br>Truth in <b id="cd">—</b>';
    } else {
      // never claim a vote was counted when it was not
      html = 'Your vote could not be sent — you are offline, or we are.' +
             '<br>The answer is still sealed. Truth in <b id="cd">—</b>';
    }

    receipt.innerHTML = html;
    receipt.hidden = false;
    if (!r.revealed) countdown();
  };

  if (votes[round.no]) { paint(votes[round.no], null, true); return; }

  box.addEventListener('click', async e => {
    const b = e.target.closest('.choice');
    if (!b || box.classList.contains('done')) return;
    const choice = b.dataset.vote;

    box.classList.add('done');
    [...box.querySelectorAll('.choice')].forEach(x => {
      x.setAttribute('aria-pressed', String(x.dataset.vote === choice));
      x.disabled = true;
    });

    let data = null, sent = false;
    try {
      const res = await fetch(API + '/api/vote', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ no: round.no, choice, voter: voterId() })
      });
      if (res.ok) { data = await res.json(); sent = true; }
    } catch {}

    if (sent) { votes[round.no] = choice; store.set('votes', votes); }
    paint(choice, data, sent);
  });

  addEventListener('keydown', e => {
    if (box.classList.contains('done')) return;
    const k = e.key.toLowerCase();
    if (k === 'h' || k === 'a') box.querySelector(`[data-vote="${k === 'h' ? 'HUMAN' : 'AI'}"]`).click();
  });
}

/* --------------------------------------------------------------- countdown */
/* One moment on Earth, not one per timezone. */
function countdown() {
  const zoneOffsetMs = (d) => {
    const asUTC = new Date(d.toLocaleString('en-US', { timeZone: 'UTC' }));
    const asZone = new Date(d.toLocaleString('en-US', { timeZone: REVEAL_ZONE }));
    return asZone - asUTC;
  };
  const tick = () => {
    const node = document.getElementById('cd');
    if (!node) return;
    const now = new Date();
    const off = zoneOffsetMs(now);
    const zoneNow = new Date(now.getTime() + off);
    const t = new Date(Date.UTC(zoneNow.getUTCFullYear(), zoneNow.getUTCMonth(),
                                zoneNow.getUTCDate(), REVEAL_HOUR, REVEAL_MIN, 0) - off);
    if (t <= now) t.setTime(t.getTime() + 86400000);
    const s = Math.floor((t - now) / 1000);
    const hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60);
    node.textContent = hh > 0 ? `${hh}h ${String(mm).padStart(2, '0')}m`
                              : `${mm}m ${String(s % 60).padStart(2, '0')}s`;
  };
  tick();
  if (!window.__cd) window.__cd = setInterval(tick, 1000);
}

boot();
</script>
</body>
</html>
